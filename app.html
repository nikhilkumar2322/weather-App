<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real-time Weather App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-blue-400 to-blue-200 min-h-screen flex flex-col items-center p-4">
  <h1 class="text-white text-3xl font-semibold mb-6 mt-8">Real-time Weather App</h1>

  <form id="weatherForm" class="w-full max-w-md flex mb-6">
    <input
      type="text"
      id="cityInput"
      placeholder="Enter city name"
      class="flex-grow rounded-l-md px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-600"
      required
      aria-label="City name"
    />
    <button
      type="submit"
      class="bg-blue-700 hover:bg-blue-800 text-white px-6 rounded-r-md flex items-center justify-center"
      aria-label="Get weather"
    >
      <i class="fas fa-search"></i>
    </button>
  </form>

  <div
    id="weatherResult"
    class="bg-white bg-opacity-80 rounded-lg shadow-lg p-6 w-full max-w-md text-center hidden"
    role="region"
    aria-live="polite"
  >
    <h2 id="cityName" class="text-2xl font-semibold mb-2"></h2>
    <p id="dateTime" class="text-gray-600 mb-4"></p>
    <div class="flex justify-center items-center mb-4">
      <img
        id="weatherIcon"
        src=""
        alt="Weather icon"
        class="w-20 h-20"
        aria-hidden="true"
      />
      <div class="ml-4 text-left">
        <p id="description" class="text-lg font-medium capitalize"></p>
        <p id="temperature" class="text-4xl font-bold mt-1"></p>
        <p id="feelsLike" class="text-gray-700 mt-1"></p>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4 text-gray-700">
      <div>
        <i class="fas fa-tint mr-2"></i>
        <span id="humidity"></span>
      </div>
      <div>
        <i class="fas fa-wind mr-2"></i>
        <span id="windSpeed"></span>
      </div>
      <div>
        <i class="fas fa-cloud-sun mr-2"></i>r̥
        <span id="sunrise"></span>
      </div>
      <div>
        <i class="fas fa-cloud-moon mr-2"></i>
        <span id="sunset"></span>
      </div>
    </div>
  </div>

  <p id="errorMessage" class="text-red-600 mt-4 font-semibold"></p>

  <script src ="app.js">
   
  </script>
</body>
</html>
